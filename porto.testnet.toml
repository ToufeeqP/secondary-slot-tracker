# secondary-slot-tracker — Avail Turing (testnet) deployment on porto.
# Read-only BABE secondary-slot monitor with Slack (incoming webhook) alerts.
# Point the porto app at this file via the remote's :path suffix or apps:set-config.

service_level = "testnet"

# Pure worker: outbound WS to the RPC + outbound Slack webhook POST. It listens on
# nothing, BUT porto always renders a K8s Service, so a valid port is required or the
# deploy fails (Service/containerPort of 0 is invalid). The avail-internal-apps chart
# adds no readiness/liveness probe, so the pod is Ready regardless and this Service is
# an inert no-op (public=false → no ingress, nothing routes to it).
[network]
port   = 8080
public = false

[resources]
cpu_request    = "50m"
cpu_limit      = "500m"
memory_request = "128Mi"   # above porto's 64Mi default — subxt/substrate types need headroom
memory_limit   = "512Mi"

[env]
RUST_LOG = "info"
WS_URL   = "wss://turing-rpc.avail.so/ws"   # authoritative — the binary reads this (structopt env)

# Slack incoming-webhook URL, pulled from AWS SSM Parameter Store at deploy time.
# porto wraps this path in a ref+awsssm:// reference (the value never passes through
# porto). Set it to your real parameter path. NOTE: the SSM parameter must exist
# before deploy, or vals resolution fails the deploy — comment this block out to run
# log-only until the webhook is provisioned.
[secrets]
SLACK_WEBHOOK_URL = "/porto/testnet/secondary-slot-tracker/slack-webhook-url"
